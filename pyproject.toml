[project]
name = "adapter-training"
version = "0.1.0"
description = "Human video -> OpenArm trajectories -> LeRobot datasets -> SmolVLA LoRA adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "coacd>=1.0.14",
    "fast-simplification>=0.2.0",
    "h5py>=3.16.0",
    "lerobot[damiao,peft,smolvla,training]==0.6.1",
    "lerobot_robot_openarm_overlay",
    "mediapipe>=1.1.1",
    "mink>=1.3.0",
    "mujoco>=3.16.0",
    "trimesh>=5.1.1",
    "truststore>=0.10.5",
    "xatlas>=0.0.11",
]

[project.scripts]
at-download = "adapter_training.download:main"
at-convert = "adapter_training.convert:main"
at-train = "adapter_training.train:main"
at-eval = "adapter_training.evaluate:main"
at-fetch-robot = "adapter_training.video.robot:main"
at-calibrate = "adapter_training.video.calibrate:main"
at-video2robot = "adapter_training.video.pipeline:main"
at-synthetic-demo = "adapter_training.video.synthetic:main"
at-datagen = "adapter_training.datagen.cli:main"
at-skill = "adapter_training.skill:main"
at-run = "adapter_training.run:main"
at-sim-eval = "adapter_training.sim_eval:main"

[project.optional-dependencies]
# GR00T N1.7 policy (NVIDIA GPU; ~3B parameters). Install with: uv sync --extra groot
groot = ["lerobot[groot]==0.6.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adapter_training"]

[tool.uv.sources]
lerobot_robot_openarm_overlay = { path = "plugins/lerobot_robot_openarm_overlay", editable = true }

[tool.uv]
# Use the OS certificate store (needed behind TLS-inspecting proxies/antivirus).
native-tls = true

[project]
# LeRobot discovers plugins by distribution name prefix "lerobot_robot_" (underscores required).
name = "lerobot_robot_openarm_overlay"
version = "0.1.0"
description = "Bimanual OpenArm follower that overlays the simulated robot on its camera frames"
requires-python = ">=3.12"
dependencies = []  # lerobot and adapter-training come from the parent project

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_openarm_overlay"]
